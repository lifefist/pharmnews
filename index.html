<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>医药头条 · 本地版</title>
<style>
  :root{ --bg:#f5f7fa; --card:#fff; --text:#1a2233; --sub:#6b7688;
         --brand:#0a7f6b; --brand-soft:#e6f4f1; --line:#e8ecf1; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  header{position:sticky;top:0;z-index:9;backdrop-filter:blur(10px);
    background:rgba(245,247,250,.85);border-bottom:1px solid var(--line);}
  .head-in{max-width:820px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:12px;}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700;}
  h1{font-size:18px;margin:0;}
  .meta{font-size:12px;color:var(--sub);}
  .spacer{flex:1;}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
    color:var(--brand);border-radius:20px;padding:6px 14px;}
  button:hover{background:var(--brand-soft);}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 60px;}
  #hint{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;
    background:#fff7e6;border:1px solid #ffe0a3;color:#8a5b00;font-size:13.5px;}
  #hint code{background:#fff;padding:1px 6px;border-radius:4px;border:1px solid #ffe0a3;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px;}
  .tab{font-size:13px;padding:4px 12px;border-radius:14px;background:#fff;
    border:1px solid var(--line);color:var(--sub);cursor:pointer;}
  .tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  article{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-top:14px;transition:.2s;}
  article:hover{box-shadow:0 6px 22px rgba(15,40,90,.07);transform:translateY(-1px);}
  article h2{font-size:17px;line-height:1.5;margin:0 0 8px;}
  article h2 a{color:var(--text);text-decoration:none;}
  article h2 a:hover{color:var(--brand);}
  .summary{color:#3d4759;margin:0 0 12px;}
  .foot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);}
  .badge{background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 8px;}
  .read{margin-left:auto;color:var(--brand);text-decoration:none;font-weight:600;}
  .empty{text-align:center;color:var(--sub);padding:60px 0;}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="logo">医</div>
    <div>
      <h1>医药头条</h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
    <div class="spacer"></div>
    <button id="reload">重新读取本地数据</button>
  </div>
</header>

<div class="wrap">
  <div id="hint"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">正在读取本地数据…</div></div>
</div>

<!-- 本地数据文件：由 update_news.py 生成；不存在也不影响页面打开 -->
<script src="news.js" onerror="window.__NEWS_MISSING__ = true"></script>

<script>
const $ = s => document.querySelector(s);
const state = { items: [], filter: '全部', updatedAt: null, fallback: false };

const searchUrl = t => 'https://www.baidu.com/s?wd=' + encodeURIComponent(t);

/* ===== 尚未抓到数据时的示例内容（接入 news.js 后自动被替换） ===== */
const FALLBACK = [
  { title:'国家药监局批准1款创新药、1款创新医疗器械上市', source:'医药经济报', time:'2026-11-02',
    summary:'通过优先审评审批程序批准Bayer AG申报的1类创新药阿舒克森片（商品名：舒华博）上市，用于降低缺血性卒中或高风险短暂性脑缺血发作（TIA）成人患者的卒中风险，不包括心源性栓塞型卒中；另批准珠海圣美生物“人类3号和10号染色体异常细胞检测试剂盒（荧光原位杂交法）”创新产品注册申请。' },
  { title:'阿舒克森片等多款创新药获批上市', source:'中国食品药品网', time:'2026-10-28',
    summary:'国家药监局批准阿舒克森片、巴托利单抗注射液、紫花温肺止嗽颗粒、盐酸艾泊度胺胶囊等注册申请。其中紫花温肺止嗽颗粒为来源于医疗机构中药制剂的中药1.1类创新药；盐酸艾泊度胺胶囊附条件批准，联合达雷妥尤单抗和地塞米松用于复发或难治多发性骨髓瘤成人患者。' },
  { title:'国家药监局批准阿舒克森片上市', source:'中国新闻网', time:'2026-10-26',
    summary:'国家药监局消息，经优先审评审批程序批准Bayer AG的1类创新药阿舒克森片（商品名：舒华博）上市，用于降低缺血性卒中或高风险短暂性脑缺血发作（TIA）成人患者的卒中风险。' },
  { title:'迪哲医药自主研发抗癌新药在美国上市；德曲妥珠单抗中国再获批', source:'每日经济新闻', time:'2026-10-25',
    summary:'舒沃替尼片（ZEGFROVY）在美国上市，用于既往含铂化疗失败或不耐受、EGFR 20号外显子插入突变的局部晚期或转移性非小细胞肺癌成人患者；优赫得（德曲妥珠单抗）于2026年10月20日获NMPA批准单药治疗HER2 IHC 3+成人实体瘤。' },
  { title:'一款成人全身型重症肌无力（gMG）罕见病药物获批准上市', source:'澎湃新闻', time:'2026-10-23',
    summary:'国家药监局批准佳曦控股有限公司申报的巴托利单抗注射液（商品名：恩力达）上市，与常规治疗药物联合用于抗乙酰胆碱受体（AChR）抗体阳性的成人全身型重症肌无力患者；石药集团同日发布公告。' },
  { title:'前三季度获批创新药国产占比达80%，多家上市公司新药密集获批', source:'中国医药信息查询平台', time:'2026-10-22',
    summary:'工信部总工程师王卫明在国新办发布会上表示，今年前三季度我国获批的创新药中国产占比达80%，肿瘤、精神、抗感染、痛风、罕见病等多领域取得重大突破；恒瑞医药年内三款1类新药获批，首药控股、健康元等亦有自研新药落地。' },
  { title:'A股药企迎来密集收获期', source:'经济日报', time:'2026-10-22',
    summary:'恒瑞医药三款1类新药分别于5月28日、7月29日、8月20日获批；首药控股康特替尼颗粒于6月12日获批，为其首款自研抗肿瘤靶向药；健康元旗下莱康奇塔单抗注射液于8月28日获批，为中国首个自主研发的IL-17A/F双靶点创新生物制剂。' }
].map(it => ({ ...it, link: searchUrl(it.title) }));

/* ================= 读取与渲染 ================= */
function readLocal(){
  const d = window.PHARMA_NEWS;
  const has = !!(d && Array.isArray(d.items) && d.items.length);
  return { items: has ? d.items : FALLBACK, updatedAt: has ? d.updatedAt : null, fallback: !has };
}

const fmtTime = t => {
  if (!t) return '';
  const d = new Date(t);
  return isNaN(d) ? t : `${d.getMonth()+1}月${d.getDate()}日`;
};

function render(){
  const { items, updatedAt, fallback } = readLocal();
  state.items = items; state.updatedAt = updatedAt; state.fallback = fallback;

  const sources = ['全部', ...new Set(items.map(i => i.source).filter(Boolean))];
  if (!sources.includes(state.filter)) state.filter = '全部';
  $('#tabs').innerHTML = sources.map(s =>
    `<span class="tab ${s === state.filter ? 'active' : ''}" data-s="${s}">${s}</span>`).join('');

  $('#meta').textContent = updatedAt
    ? '数据更新于 ' + new Date(updatedAt).toLocaleString('zh-CN', { hour12:false }) + ' · 本地数据'
    : '尚未生成本地数据 · 当前为示例内容';

  const hint = $('#hint');
  if (fallback){
    hint.style.display = 'block';
    hint.innerHTML = '还没有抓到真实数据。请在本文件夹运行 <code>python update_news.py</code> 生成 <code>news.js</code>，然后点右上角“重新读取本地数据”。';
  } else {
    hint.style.display = 'none';
  }
  draw();
}

function draw(){
  const list = state.filter === '全部'
    ? state.items
    : state.items.filter(i => i.source === state.filter);
  $('#list').innerHTML = list.length ? list.map(i => `
    <article>
      <h2><a href="${i.link}" target="_blank" rel="noopener">${i.title}</a></h2>
      <p class="summary">${i.summary || '（暂无摘要，可点“查看原文”）'}</p>
      <div class="foot">
        <span class="badge">${i.source || '来源'}</span>
        <span>${fmtTime(i.time)}</span>
        <a class="read" href="${i.link}" target="_blank" rel="noopener">查看原文 →</a>
      </div>
    </article>`).join('') : '<div class="empty">暂无内容</div>';
}

$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  state.filter = t.dataset.s;
  render();
});

/* 重新读取本地 news.js（加时间戳绕开缓存） */
function reloadLocal(){
  return new Promise(resolve => {
    const before = state.updatedAt || '';
    const s = document.createElement('script');
    s.src = 'news.js?t=' + Date.now();
    s.onload = () => {
      s.remove();
      const changed = (window.PHARMA_NEWS?.updatedAt || '') !== before;
      if (changed) render();
      resolve(changed);
    };
    s.onerror = () => { s.remove(); window.__NEWS_MISSING__ = true; render(); resolve(false); };
    document.body.appendChild(s);
  });
}

$('#reload').onclick = () => reloadLocal();

/* 页面开着时，每 30 分钟尝试读一次新数据（有更新才重绘） */
setInterval(reloadLocal, 30 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) reloadLocal(); });

render();
</script>
</body>
</html>
